# passer configuration
#
# Copied to $XDG_CONFIG_HOME/passer/config.toml (default
# ~/.config/passer/config.toml) on first run. Every key below is optional;
# anything you leave out keeps its default.
#
# Edit it from inside the app with `:config` — passer reloads it when your
# editor exits.

# Where the password store lives.
#
# Empty means "do what pass does": use $PASSWORD_STORE_DIR if it is set, and
# ~/.password-store otherwise. Set it only if you want passer pinned to one
# store regardless of the surrounding shell.
store_dir = ''

# Field names treated as the account identifier by the "copy username" key.
# These are tried first; the built-in conventions (login, username, user,
# email, account) still apply afterwards.
#
# With no field match, the key falls back to an email-looking address on a bare
# line, then to the entry's own name ("web/github.com/you@example.com"). Add a
# key here if your store labels the account with something else, e.g. 'acct'.
username_fields = ['login', 'username', 'user', 'email']


[security]

# How long a copied secret stays on the clipboard, in seconds.
# 45 matches pass's own default. 0 disables auto-clear entirely — passer will
# say so when you copy, rather than implying a timer that never fires.
#
# The clipboard is only wiped if it still holds what passer put there, so
# anything you copied in the meantime is left alone.
clip_clear_seconds = 45

# How long a revealed password stays on screen before it is masked again.
# A revealed password is readable by anyone near your terminal and survives in
# scrollback; this bounds that exposure. 0 keeps it visible until you hide it.
reveal_seconds = 30

# Drop the decrypted entry from memory after this many seconds without a
# keypress, returning to the list. 0 keeps it until you close the detail view.
lock_seconds = 120


[generate]

# Length of generated passwords.
length = 24

# Include punctuation ([:punct:], the same class `pass generate` uses).
# Set false for sites that reject symbols — the equivalent of `pass generate -n`.
symbols = true


[keys]

# Every key is rebindable. Use the names bubbletea reports: single characters,
# 'enter', 'esc', 'tab', 'up', 'down', 'ctrl+a', and ' ' for space.

quit = 'q'            # back out of a filter or view; quit from the plain list
up = 'k'
down = 'j'
open = 'enter'        # decrypt and open the entry
cancel = 'esc'
search = '/'          # fuzzy filter
command = ':'         # command line
help = '?'
reload = 'R'          # re-read the store from disk

copy_password = 'y'
copy_username = 'u'
copy_url = 'b'
set_username = 'U'    # register the account on an entry, without $EDITOR

reveal = ' '          # show/hide the password in the detail view
add = 'a'
edit = 'e'            # edit the focused field in an open entry; from the
                      # list, open the whole file in $EDITOR
edit_file = 'E'       # always open the whole file in $EDITOR via `pass edit`
delete = 'D'
rename = 'm'          # rename / move
theme_toggle = 't'    # cycle palettes, applied and saved immediately


[theme]

# Built-in palettes: light (default), dark, purple, ocean, forest, rose,
# graphite. Switch with `:theme <name>`, or cycle them live with `t`.
#
# A preset provides the base colors; any key you set below overrides it, so you
# can start from a palette and adjust a single hue.
preset = 'light'

# The values below are the `light` palette, shown so you can see what each key
# controls. They are the defaults when preset = 'light', so uncommenting one
# changes nothing until you edit it. If you switch `preset` above to a dark
# palette, delete these lines first — an uncommented light color overrides the
# preset and will strand one element in the wrong palette.
#
# Each color is chosen to clear 4.5:1 against every surface it is drawn on
# (3:1 for the border, which is a frame rather than text). Hand-tuning one is
# fine; `go test ./internal/config` will tell you if a built-in palette ever
# stops meeting that bar.

# background = '#F5F2EB'     # full terminal canvas
# foreground = '#25332F'     # entry names, values, and input text
# title = '#1C5560'          # help-screen section titles
# heading = '#3C5C53'        # field labels, and the entry name in the status bar
# accent = '#23685D'         # cursor, panel title text, fuzzy-match highlights
# muted = '#525B54'          # folder prefixes, masked values, secondary text
# success = '#2F6B2A'        # the match counter in the status bar
# warning = '#7A4A12'        # revealed secrets are drawn in this color
# danger = '#B43E43'         # errors and delete confirmations
# border = '#819081'         # rounded panel frames
# selection_bg = '#C6DCD0'   # highlighted row
# selection_fg = '#25332F'
# status_bg = '#E6E8DF'      # status bar
# status_fg = '#25332F'
# status_alt_bg = '#D8DBCD'  # table header bar, mode badge, and key-hint chips
# status_alt_fg = '#42574E'
# row_stripe_bg = '#ECEFE6'  # kept for bada compatibility; the list no longer stripes rows
